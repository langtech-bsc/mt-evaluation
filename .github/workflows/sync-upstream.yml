name: Sync with upstream lm-evaluation-harness

# Weekly, checks EleutherAI/lm-evaluation-harness for a new stable release.
# A clean merge lands on the default branch automatically. A merge with
# conflicts is pushed to a branch and opened as a PR for manual resolution.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the newest upstream release
        id: rel
        run: |
          git remote add upstream https://github.com/EleutherAI/lm-evaluation-harness.git
          git fetch --tags upstream

          # Newest plain release tag: vX.Y.Z, no -dev / -rc suffix
          TAG=$(git tag -l 'v*' --sort=-creatordate \
                | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)*$' | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$TAG" HEAD 2>/dev/null; then
            echo "already merged: $TAG"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "new release to merge: $TAG"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge, or open a PR if it conflicts
        if: steps.rel.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BASE="${{ github.ref_name }}"
          TAG="${{ steps.rel.outputs.tag }}"
          BRANCH="sync-upstream-$TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.renameLimit 20000

          # The default GITHUB_TOKEN cannot push changes under .github/workflows/,
          # and this fork does not want upstream's CI, so drop upstream's workflow
          # changes after any merge.
          restore_workflows() {
            if ! git diff --quiet "origin/$BASE" -- .github/workflows; then
              git checkout "origin/$BASE" -- .github/workflows
              git commit -m "Keep the fork's own .github/workflows (skip upstream CI changes)"
            fi
          }

          if git merge "$TAG" --no-edit; then
            # Clean merge -> land it on the default branch directly.
            restore_workflows
            git push origin "HEAD:$BASE"
            echo "Clean merge of $TAG pushed to $BASE."
          else
            # Conflicts -> commit markers on a branch and open a PR to resolve.
            git merge --abort
            git checkout -B "$BRANCH"
            git merge "$TAG" --no-edit || true
            git add -A
            git commit -m "Merge $TAG (WITH CONFLICTS - resolve before merging)"
            restore_workflows
            git push -u origin "$BRANCH" --force

            CONFLICTS=$(git diff "origin/$BASE"...HEAD --name-only --diff-filter=U 2>/dev/null || true)
            BODY=$(printf '%s\n' \
              "Merging upstream $TAG hit conflicts, and the markers are committed as-is," \
              "so this branch does **not** build. Resolve the conflicting files, then push" \
              "to the branch." \
              "" \
              "Rule of thumb from the v0.4.12 sync: for files upstream rewrote, take their" \
              "version and re-apply our changes on top rather than keeping ours.")
            gh pr create --title "Sync with upstream $TAG (conflicts)" \
              --body "$BODY" --base "$BASE" --head "$BRANCH" \
              || echo "A PR for this branch already exists; branch updated in place."
          fi
