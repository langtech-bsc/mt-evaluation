mt_metrics:
  bleu:
    compute: True
    lowercase: False
    tokenize: null
    smooth_method: "exp"
    smooth_value: null
    force: False
    use_effective_order: False

  ter:
    compute: True
    normalized: False
    no_punct: False
    asian_support: False
    case_sensitive: False

  chrf:
    compute: True
    char_order: 6
    word_order: 0
    beta: 2
    remove_whitespace: True
    eps_smoothing: False
  
  # True
  comet:
    compute: True
    batch_size: 8
    checkpoint: "Unbabel/wmt22-comet-da"
  
  # True
  comet_kiwi:
    compute: True
    batch_size: 8 
    checkpoint: "Unbabel/wmt22-cometkiwi-da"

  xcomet:
    compute: False
    batch_size: 8
    checkpoint: "Unbabel/XCOMET-XL"

  xcomet_qe:
    compute: False
    batch_size: 8
    checkpoint: "Unbabel/XCOMET-XL"
  # True
  bleurt:
    compute: True
    batch_size: 8
    checkpoint: "${MT_MODELS_DIR}/BLEURT-20"
  # True
  metricx:
    compute: True
    checkpoint: "${MT_MODELS_DIR}/google_metricx_23_xl_v2p0"
    tokenizer: "${MT_MODELS_DIR}/google_mt5_xl"
  # True
  metricx_qe:
    compute: True
    checkpoint: "${MT_MODELS_DIR}/google_metricx_23_qe_xl_v2p0"
    tokenizer: "${MT_MODELS_DIR}/google_mt5_xl"

  mutox:
    checkpoint: "${MT_MODELS_DIR}/sonar_encoder" # cointegrated/SONAR_200_text_encoder
    batch_size: 8

  detoxify:
    compute: False
    batch_size: 8

  blonde:
    compute: False

  bleu_penalty:
    compute: True

  llm_judge:
    compute: False                  # run the judge in scripts/run_mt_v3.sh (stage 3, vLLM env); needs tensor_parallel_size GPUs
    name: auto                      # auto = built from the settings below, e.g. gemba_esa_gemma_4_31b_noref_raw_bf16; or a fixed result key prefix
    model: "${MT_MODELS_DIR}/gemma-4-31B-it"
    quantization: fp8              # none = bf16 weights (2 GPUs); fp8 = fp8 weights (fits 1 GPU, set tensor_parallel_size: 1)
    tensor_parallel_size: 1         # number of GPUs (31B in bf16 needs 2)
    max_model_len: 16384
    use_reference: False            # True = show the reference to the judge; False = reference-free
    stage2_input: raw               # Stage 2 gets the raw Stage 1 answer ("raw", as in GEMBA) or the parsed spans ("parsed", as in WMT26)
    reference_type: "human"         # if use_reference: "human" | "postedit" | "pseudo"
    domain_requirements: ""         # free text added to the prompt; empty = "The translation should be accurate and fluent."; news/speech/social/software/edu/...