mt_metrics:
  bleu:
    compute: True
    lowercase: False
    tokenize: null
    smooth_method: "exp"
    smooth_value: null
    force: False
    use_effective_order: False

  ter:
    compute: True
    normalized: False
    no_punct: False
    asian_support: False
    case_sensitive: False

  chrf:
    compute: True
    char_order: 6
    word_order: 0
    beta: 2
    remove_whitespace: True
    eps_smoothing: False
  
  comet:
    compute: True
    batch_size: 8
    checkpoint: "Unbabel/wmt22-comet-da"

  comet_kiwi:
    compute: True
    batch_size: 8 
    checkpoint: "Unbabel/wmt22-cometkiwi-da"

  xcomet:
    compute: False
    batch_size: 8
    checkpoint: "Unbabel/XCOMET-XL"

  xcomet_qe:
    compute: False
    batch_size: 8
    checkpoint: "Unbabel/XCOMET-XL"

  bleurt:
    compute: True
    batch_size: 8
    checkpoint: "/gpfs/projects/bsc88/hf-models/BLEURT-20"

  metricx:
    compute: True
    checkpoint: "/gpfs/projects/bsc88/hf-models/google_metricx_23_xl_v2p0"
    tokenizer: "/gpfs/projects/bsc88/hf-models/google_mt5_xl"

  metricx_qe:
    compute: True
    checkpoint: "/gpfs/projects/bsc88/hf-models/google_metricx_23_qe_xl_v2p0"
    tokenizer: "/gpfs/projects/bsc88/hf-models/google_mt5_xl"

  mutox:
    checkpoint: "/gpfs/projects/bsc88/hf-models/sonar_encoder" # cointegrated/SONAR_200_text_encoder
    batch_size: 8

  detoxify:
    compute: True
    batch_size: 8

  blonde:
    compute: True

  bleu_penalty:
    compute: True