mt_metrics:
  bleu:
    compute: True
    lowercase: False
    tokenize: null
    smooth_method: "exp"
    smooth_value: null
    force: False
    use_effective_order: False

  ter:
    compute: True
    normalized: True
    no_punct: False
    asian_support: False
    case_sensitive: False

  chrf:
    compute: True
    char_order: 6
    word_order: 0
    beta: 2
    remove_whitespace: True
    eps_smoothing: False
  
  # True
  comet:
    compute: True
    batch_size: 8
    checkpoint: "Unbabel/wmt22-comet-da"
  
  # True
  comet_kiwi:
    compute: True
    batch_size: 8 
    checkpoint: "Unbabel/wmt22-cometkiwi-da"

  xcomet:
    compute: False
    batch_size: 8
    checkpoint: "Unbabel/XCOMET-XL"

  xcomet_qe:
    compute: False
    batch_size: 8
    checkpoint: "Unbabel/XCOMET-XL"
  # True
  bleurt:
    compute: True
    batch_size: 8
    checkpoint: "${MT_MODELS_DIR}/BLEURT-20"
  # True
  metricx:
    compute: True
    checkpoint: "${MT_MODELS_DIR}/google_metricx_23_xl_v2p0"
    tokenizer: "${MT_MODELS_DIR}/google_mt5_xl"
  # True
  metricx_qe:
    compute: True
    checkpoint: "${MT_MODELS_DIR}/google_metricx_23_qe_xl_v2p0"
    tokenizer: "${MT_MODELS_DIR}/google_mt5_xl"

  mutox:
    checkpoint: "${MT_MODELS_DIR}/sonar_encoder" # cointegrated/SONAR_200_text_encoder
    batch_size: 8

  detoxify:
    compute: False
    batch_size: 8

  blonde:
    compute: False

  bleu_penalty:
    compute: True